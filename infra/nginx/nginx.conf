worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  proxy_cache_path /var/cache/nginx
    levels=1:2
    keys_zone=localstack_s3_cache:100m
    max_size=5g
    inactive=24h
    use_temp_path=off;

  upstream localstack_s3_upstream {
    server localstack:4566;
  }

  server {
    listen 80;
    server_name _;

    # Frontend URL:
    #   http://localhost:<nginx-port>/videos/path/to/file.mp4
    #
    # Proxied to LocalStack S3:
    #   http://localstack:4566/YOUR_VIDEOS_BUCKET_NAME/path/to/file.mp4
    location /videos/ {
      proxy_pass http://localstack_s3_upstream/videos/;

      proxy_set_header Host localstack:4566;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";

      proxy_http_version 1.1;

      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;

      # Hide CORS headers coming from LocalStack/S3
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header Access-Control-Max-Age;

      # Let Nginx emit exactly one CORS policy
      add_header Access-Control-Allow-Origin "http://localhost:3000" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "*" always;
      add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Range, Accept-Ranges" always;
      add_header Vary "Origin" always;

      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "http://localhost:3000" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Max-Age 3600 always;
        add_header Content-Length 0;
        return 204;
      }

      proxy_cache localstack_s3_cache;
      proxy_cache_methods GET HEAD;
      proxy_cache_lock on;
      proxy_cache_revalidate on;
      proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504 updating;
      proxy_cache_valid 200 206 301 302 10m;
      proxy_cache_valid 404 1m;

      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}